<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="css-style-code/men-style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <meta  charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <title>BRAND SHOPPING</title>
    </head>

    <body>
         
        <nav class="navbar">

            <h2 id="logo">AURAFITS</h2>

            <div class="links">
            <a href="index.html">HOME</a>
            <a href="men.html">MEN</a>
            <a href="women.html">WOMEN</a>
            <a href="kids.html">KIDS</a>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="input" type="text" placeholder="Search for products , brands and more.. ">
            </div>

            <section class="icons">

            <div class="profile">
                <i class="fa-regular fa-circle-user"></i>
            </div>

            <div class="wishlist">

                <i class="fa-solid fa-heart"></i>

                <span id="wishlist-count">0</span>

            </div>

            <div class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>

            </section>
        </nav>

            <section class="hero-section">
                
                <div class="hero-image">
                <img src="project_images/men-fashion-banner-1.jpg">
                </div>

            </section>

            <section class="mens-collection">

                <h2>Shop By Style</h2>

                <div class="collection-container">
                    
                    <a href="shirts.html">

                    <div class="card-collection">
                        <img src="project_images/men's wear/shirts/shirts.jpg" alt="Men's Shirts">
                        <h3>Men's Shirts</h3>
                    </div>

                    </a>

                    <a href="tshirts.html">

                    <div class="card-collection">
                        <img src="project_images/men's wear/t-shirts/tshirts.jpg">
                        <h3>Men's T-Shirts</h3>
                    </div>

                    </a>

                    <a href="trousers.html">

                    <div class="card-collection">
                        <img src="project_images/men's wear/trousers/trouser-5.jpg">
                        <h3>Men's Trousers</h3>
                    </div>

                    </a>

                </div>

            </section>

            <footer class="footer">

                <div class="footer-image">
                    <img src="project_images/men's wear/shirts/men-banner.jpg">
                </div>

            </footer>

            <script>

            const searchInput = document.getElementById("input");

            searchInput.addEventListener("keydown", (event) => {

                if(event.key === "Enter") {

                    const searchValue = searchInput.value.toLowerCase();

                    if(searchValue.includes("shirt")) {

                        window.location.href = "shirts.html";

                    }

                    else if(searchValue.includes("tshirt")) {

                        window.location.href = "tshirts.html";

                    }

                    else if(searchValue.includes("trouser")) {

                        window.location.href = "trousers.html";

                    }


                }

            });

</script>

        </body>
</html>
