<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="css-style-code/shirts.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <meta  charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;600;700&display=swap"
         rel="stylesheet">

        <title>BRAND SHOPPING</title>
        
    </head>

    <body>
         
        <nav class="navbar">

            <h2 id="logo">AURAFITS</h2>

            <div class="links">
            <a href="index.html">HOME</a>
            <a href="men.html">MEN</a>
            <a href="women.html">WOMEN</a>
            <a href="kids.html">KIDS</a>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="input" type="text" placeholder="Search for products , brands and more.. ">
            </div>

            <section class="icons">

            <div class="profile">
                <i class="fa-regular fa-circle-user"></i>
            </div>

            <div class="wishlist">

                <i class="fa-solid fa-heart"></i>

                <span id="wishlist-count">0</span>

            </div>

    

            <div class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>

            </section>

        </nav>

        <section class="products">

            <h2>AURAFITS MEN'S SHIRT COLLECTION</h2>

            <div class="product-container">

                <div class="product-image">
                    <img src="project_images/men's wear/shirts/shirt.jpg">
                    <h3>Classic White Shirt</h3>
                    <p>Rs.2,499</p>
                    <button class="wishlist-btn">❤️ Wishlist</button>
                </div>
                 
                <div class="product-image">
                    <img src="project_images/men's wear/shirts/shirt-1.jpg">
                    <h3>Urban Navy Shirt</h3>
                    <p>Rs.1,999</p>
                    <button class="wishlist-btn">❤️ Wishlist</button>
                </div>

                <div class="product-image">
                    <img src="project_images/men's wear/shirts/Shirt-2.jpg">
                    <h3>Azure Formal Shirt</h3>
                    <p>Rs.1,499</p>
                    <button class="wishlist-btn">❤️ Wishlist</button>
                </div>


                <div class="product-image">
                    <img src="project_images/men's wear/shirts/shirt-3.jpg">
                    <h3>Soft Lavender Classic</h3>
                    <p>Rs.2,999</p>
                    <button class="wishlist-btn">❤️ Wishlist</button>
                </div>


                <div class="product-image">
                    <img src="project_images/men's wear/shirts/shirt-4.jpg">
                    <h3>Pure Linen White Shirt</h3>
                    <p>Rs.3,499</p>
                    <button class="wishlist-btn">❤️ Wishlist</button>
                </div>


                <div class="product-image">
                    <img src="project_images/men-fashion-3.jpg">
                    <h3>Modern Essential Shirt</h3>
                    <p>Rs.2,999</p>
                    <button class="wishlist-btn">❤️ Wishlist</button>
                </div>

            </div>

        </section>

        <section class="footer-container">

            <div class="footer-image">
                <img src="project_images/men-fashion-banner-5.jpg">

            <h3>Crafted for the modern gentleman...</h3>
            </div>

        </section>

     <script>

        let wishlistCount = 0;

        const wishlistButtons = document.querySelectorAll(".wishlist-btn");

        wishlistButtons.forEach((button) => {

            button.addEventListener("click", () => {

                wishlistCount++;

                document.getElementById("wishlist-count").textContent = wishlistCount;

            });

        });

     </script>
        
    </body>
</html>
