<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="../css-style-code/kids.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <meta  charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <title>BRAND SHOPPING</title>
    </head>

    <body>
         
        <nav class="navbar">

            <h2 id="logo">AURAFITS</h2>

            <div class="links">
            <a href="shop.html">HOME</a>
            <a href="men.html">MEN</a>
            <a href="women.html">WOMEN</a>
            <a href="kids.html">KIDS</a>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="input" type="text" placeholder="Search for products , brands and more.. ">
            </div>

            <section class="icons">

            <div class="profile">
                <i class="fa-regular fa-circle-user"></i>
            </div>

            <div class="wishlist">

                <i class="fa-solid fa-heart"></i>

                <span id="wishlist-count">0</span>

            </div>

            <div class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>

            </section>
        </nav>

            <section class="hero-section">
                
                <div class="hero-image">
                <img src="../project_images/kids-banner-3.jpg">
                </div>

            </section>

            <section class="kids-collection">

                <h2>Shop By Style</h2>

                <div class="collection-container">
                

                    <div class="card-collection" id="kids-casuals">
                        <img src="../project_images/kids wear/kids casuals/kids-wear.jpg">
                        <h3>Kids Casuals</h3>
                    </div>


                    <div class="card-collection" id="kids-party">
                        <img src="../project_images/kids wear/kids party wear/kids-party-wear.jpg">
                        <h3>Party Wear</h3>
                    </div>


                    <div class="card-collection" id="sets">
                        <img src="../project_images/kids wear/kids sets/kids-sets-3.jpg">
                        <h3>Kids Sets</h3>
                    </div>

                </div>

            </section>

            <section class="dynamic-products">

                <div class="dynamic-container">


                </div>

            </section>

            <footer class="footer">

                <div class="footer-image">
                    <img src="../project_images/kids-banner-4.jpg">
                    <h3>Little styles for the brightest smiles.</h3>
                </div>

            </footer>

            <script src="../java-script-code/kids.js"></script>

        </body>
</html>
